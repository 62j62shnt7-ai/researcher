name: Build Knowledge Base & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'codes/**'
      - 'scripts/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache FastEmbed & HuggingFace Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: fastembed-models-${{ runner.os }}-bge-small-en-v1.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf pdfplumber python-docx openpyxl fastembed


      - name: Build Knowledge Base Index (Free FastEmbed + Gemini)

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/build_index.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
